name: Deploy staging
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: brasa-identity-staging, cancel-in-progress: false }
jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package:staging
      - run: npx wrangler d1 migrations apply brasa-identity-staging --config wrangler.staging.jsonc --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run smoke:staging
        env: { STAGING_BASE_URL: "${{ secrets.STAGING_BASE_URL }}" }
