name = "brasa-signup"
main = "src/index.js"
compatibility_date = "2026-01-01"

# brasa-govid D1 — bound as env.DB (dedicated GovID database)
[[d1_databases]]
binding = "DB"
database_name = "brasa-govid"
database_id = "0cf3acea-bdd9-420e-97b8-2a503ea14714"

[vars]
WA_VERIFY_TOKEN = "set-in-dashboard-or-here"
ROOT_PUBLIC_KEY = "base64-ed25519-root-public-key"
SIGNING_KEY_ID  = "key-xxxxxxxxxxxxxxxx"
